# Build conventions
gtnh.settings.blowdryerTag = 0.2.2
modName = Horizonwright
modId = horizonwright
modGroup = io.github.kaseyawolf2.horizonwright
useModGroupForPublishing = true
autoUpdateBuildScript = false
gtnh.modules.gitVersion = false
modVersion = 0.1.0-SNAPSHOT

# Pinned Minecraft toolchain
minecraftVersion = 1.7.10
forgeVersion = 10.13.4.1614
channel = stable
mappingsVersion = 12
remoteMappings = https\://raw.githubusercontent.com/MinecraftForge/FML/1.7.10/conf/
developmentEnvironmentUserName = HorizonwrightDeveloper
enableModernJavaSyntax = jabel
enableGenericInjection = true

# Generated build metadata
generateGradleTokenClass = io.github.kaseyawolf2.horizonwright.Tags
gradleTokenVersion = VERSION
replaceGradleTokenInFile =

# API and bytecode transformation settings
apiPackage =
accessTransformersFile = horizonwright_at.cfg
usesMixins = false
separateMixinSourceSet =
usesMixinDebug = false
mixinPlugin =
mixinsPackage =
coreModClass =
containsMixinsAndOrCoreModOnly = false
forceEnableMixins = false

# Dependency packaging
usesShadowedDependencies = false
minimizeShadowedDependencies = true
relocateShadowedDependencies = true
includeWellKnownRepositories = true
excludeWellKnownRepositories =

# Publishing remains disabled until the first release checklist is complete.
usesMavenPublishing = false
modrinthProjectId =
modrinthRelations =
curseForgeProjectId =
curseForgeRelations =

org.gradle.configuration-cache = true
org.gradle.parallel = true
